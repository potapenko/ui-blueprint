[workspace]
members = ["crates/schema", "crates/plugin-api", "crates/engine", "crates/cli", "crates/export"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
schemars = "=1.2.2"
jsonschema = { version = "=0.58.5", default-features = false }
