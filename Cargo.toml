[workspace]
members = ["crates/schema", "crates/plugin-api"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
schemars = "=1.2.2"
jsonschema = { version = "=0.58.5", default-features = false }
