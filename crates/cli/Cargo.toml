[package]
name = "uiblueprint-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Bounded local UI Blueprint geometry CLI"

[[bin]]
name = "uiblueprint"
path = "src/main.rs"

[dependencies]
uiblueprint-schema = { path = "../schema" }
uiblueprint-engine = { path = "../engine" }
serde_json.workspace = true
uiblueprint-export = { path = "../export" }
serde = { workspace = true, optional = true }
uiblueprint-host = { path = "../host", optional = true }

[features]
default = []
macos = ["dep:uiblueprint-host", "dep:serde"]
web = ["dep:uiblueprint-host", "dep:serde", "uiblueprint-host/web"]
