[package]
name = "uiblueprint-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Bounded parent leases and supervised canonical worker processing"

[dependencies]
uiblueprint-schema = { path = "../schema" }
uiblueprint-engine = { path = "../engine" }
uiblueprint-plugin-api = { path = "../plugin-api" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[[bin]]
name = "session-worker"
path = "src/main.rs"
test = false

[[example]]
name = "process_peer"
path = "tests/support/process_peer.rs"
test = false

[[example]]
name = "effect_peer"
path = "tests/support/effect_peer.rs"
test = false

[[example]]
name = "allocator_probe"
path = "tests/support/allocator_probe.rs"
test = false
