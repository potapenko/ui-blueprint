name: Verify UI Blueprint source release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric version from VERSION (for example 0.1.0)
        required: true
        type: string
      revision:
        description: Reviewed source commit (full 40-character SHA)
        required: true
        type: string
      create_draft:
        description: Create a GitHub draft after verification (requires explicit authorization)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      UIB_VERSION: ${{ inputs.version }}
      UIB_REVISION: ${{ inputs.revision }}
    steps:
      - name: Validate explicit release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$UIB_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$UIB_REVISION" =~ ^[0-9a-f]{40}$ ]]
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >> "$GITHUB_ENV"
      - name: Check out the reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Check source version and release notes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$UIB_REVISION"
          python3 -B - <<'PY'
          import os, release
          version = release.source_version('HEAD')
          if version != os.environ['UIB_VERSION']:
              raise SystemExit('Requested version differs from committed VERSION')
          release.release_notes('HEAD', version)
          PY
      - name: Prepare the pinned build toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          cargo fetch --locked
          command -v shellcheck >/dev/null || brew install shellcheck
      - name: Check CLI and release caller
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked -p uiblueprint-cli --test binary
          node tests/bridges/web/bootstrap-check.cjs --check
          shellcheck install.sh
      - name: Verify local source installation
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/uiblueprint-candidate"
          mkdir "$candidate"
          python3 -B release.py prepare --revision "$UIB_REVISION" --version "$UIB_VERSION" --destination "$candidate"
          python3 -B release.py verify --destination "$candidate"
          python3 -B tests/bridges/release_check.py --candidate "$candidate"
          python3 -B release.py notes --revision "$UIB_REVISION" > "$candidate/RELEASE_NOTES.md"

  draft:
    if: ${{ inputs.create_draft }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      UIB_VERSION: ${{ inputs.version }}
      UIB_REVISION: ${{ inputs.revision }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the verified source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Verify source metadata and refuse an existing tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$UIB_REVISION"
          test "$(cat VERSION)" = "$UIB_VERSION"
          test -s LICENSE
          python3 -B release.py notes --revision "$UIB_REVISION" > "$RUNNER_TEMP/RELEASE_NOTES.md"
          existing=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/v$UIB_VERSION")
          test -z "$existing" || { echo 'Version tag already exists; choose a new version'; exit 1; }
      - name: Create source-only draft (no uploaded assets)
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v$UIB_VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$UIB_REVISION" --draft --title "UI Blueprint $UIB_VERSION" \
            --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md"
