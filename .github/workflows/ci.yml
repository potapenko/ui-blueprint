name: Rust CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.selection }})
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - selection: default
            features: ""
          - selection: web
            features: uiblueprint-cli/web
          - selection: macos
            features: uiblueprint-cli/macos
          - selection: web-macos
            features: uiblueprint-cli/web,uiblueprint-cli/macos
    env:
      CARGO_TERM_COLOR: always
      UIB_FEATURES: ${{ matrix.features }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare pinned toolchain
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >> "$GITHUB_ENV"
          rustup show active-toolchain
          cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --locked --workspace --all-targets --features "$UIB_FEATURES" -- -D warnings
      - name: Build CLI, worker and test peers
        run: cargo build --locked --workspace --bins --examples --features "$UIB_FEATURES"
      - name: Test workspace
        run: cargo test --locked --workspace --features "$UIB_FEATURES" -- --test-threads=1
